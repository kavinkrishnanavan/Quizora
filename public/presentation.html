<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quiz-Wiz AI Presentation Generator</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

:root{

  --bg:#050816;
  --card:#0f172a;
  --text:#f8fafc;
  --muted:#94a3b8;
  --primary:#3b82f6;
  --border:rgba(255,255,255,0.08);

}

*{

  margin:0;
  padding:0;
  box-sizing:border-box;

}

body{

  font-family:"Inter",sans-serif;

  background:
    radial-gradient(circle at top left,
      rgba(59,130,246,0.2),
      transparent 30%),

    radial-gradient(circle at bottom right,
      rgba(6,182,212,0.18),
      transparent 35%),

    var(--bg);

  color:var(--text);

  overflow-x:hidden;

}

.topbar{

  position:sticky;
  top:0;
  z-index:1000;

  background:rgba(5,8,22,0.7);

  backdrop-filter:blur(20px);

  border-bottom:1px solid rgba(255,255,255,0.06);

}

.topbar-inner{

  max-width:1500px;

  margin:auto;

  padding:18px 24px;

  display:flex;

  align-items:center;

  justify-content:space-between;

}

.brand{

  font-size:1.4rem;

  font-weight:900;

}

button{

  background:linear-gradient(
    135deg,
    #2563eb,
    #06b6d4
  );

  border:none;

  color:white;

  padding:14px 24px;

  border-radius:18px;

  font-weight:700;

  cursor:pointer;

  transition:0.3s;

}

button:hover{

  transform:translateY(-2px);

}

.main{

  max-width:1500px;

  margin:auto;

  padding:40px 24px;

}

.form-grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));

  gap:18px;

}

.field{

  display:flex;

  flex-direction:column;

  gap:10px;

}

label{

  color:#94a3b8;

  font-weight:700;

}

input,
textarea,
select{

  background:rgba(255,255,255,0.05);

  border:1px solid rgba(255,255,255,0.08);

  color:white;

  padding:14px 16px;

  border-radius:16px;

  outline:none;

  font-family:inherit;

}

textarea{

  width:100%;
  min-height:120px;

  resize:vertical;

}

.actions{

  display:flex;

  gap:14px;

  margin-top:24px;

}

.status{

  margin-top:20px;

  color:#60a5fa;

  font-weight:700;

}

.preview{

  margin-top:40px;

  border-radius:30px;

  overflow:hidden;

  border:1px solid rgba(255,255,255,0.06);

  background:black;

}

iframe{

  width:100%;

  height:900px;

  border:none;

  background:black;

}

</style>

</head>

<body>

<header class="topbar">

  <div class="topbar-inner">

    <div class="brand">
      Quiz-Wiz AI
    </div>

  </div>

</header>

<div class="main">

  <div class="form-grid">

    <div class="field">

      <label>Topic</label>

      <input
      id="topic"
      value="Linear Equations">

    </div>

    <div class="field">

      <label>Grade</label>

      <select id="grade">

        <option>Grade 1</option>
        <option>Grade 2</option>
        <option>Grade 3</option>
        <option>Grade 4</option>
        <option>Grade 5</option>
        <option>Grade 6</option>
        <option>Grade 7</option>
        <option>Grade 8</option>
        <option selected>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>

      </select>

    </div>

    <div class="field">

      <label>Slides</label>

      <input
      id="slides"
      type="number"
      value="8">

    </div>

    <div class="field">

      <label>Tone</label>

      <select id="tone">

        <option selected>
          Modern
        </option>

        <option>
          Fun
        </option>

        <option>
          Professional
        </option>

        <option>
          Futuristic
        </option>

      </select>

    </div>

  </div>

  <div class="field"
  style="margin-top:20px;">

    <label>Special Requests</label>

    <textarea id="extra"></textarea>

  </div>

  <div class="actions">

    <button id="generateBtn">
      Generate Presentation
    </button>

    <button id="downloadBtn">
      Download PDF
    </button>

  </div>

  <div class="status"
  id="status"></div>

  <div class="preview">

    <iframe id="preview"></iframe>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const preview =
document.getElementById("preview");

const statusEl =
document.getElementById("status");

let currentHtml = "";

function buildPresentation(deck){

  const slides =
  Array.isArray(deck?.slides)
  ? deck.slides
  : [];

  return `
<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:Inter,sans-serif;

  background:#050816;

  color:white;

  overflow-x:hidden;

}

section{

  min-height:100vh;

  padding:80px;

  display:flex;

  align-items:center;

  justify-content:center;

  position:relative;

  overflow:hidden;

}

</style>

</head>

<body>

${slides.map((slide,index)=>{

  if(slide.html){

    return `
      <section>

        ${slide.html}

      </section>
    `;

  }

  return `
    <section>

      <div style="
        max-width:1200px;
        margin:auto;
      ">

        <div style="
          color:#60a5fa;
          margin-bottom:20px;
          font-weight:700;
          letter-spacing:0.2em;
        ">

          SLIDE ${index+1}

        </div>

        <h1 style="
          font-size:4rem;
          margin-bottom:30px;
        ">

          ${slide.heading || "Untitled"}

        </h1>

        ${(slide.paragraphs || []).map(p=>`

          <p style="
            font-size:1.3rem;
            line-height:1.8;
            margin-bottom:20px;
            color:#dbeafe;
          ">

            ${p}

          </p>

        `).join("")}

      </div>

    </section>
  `;

}).join("")}

</body>
</html>
`;

}

async function generatePresentation(){

  statusEl.innerText =
  "Generating presentation...";

  try{

    const topic =
    document.getElementById("topic").value;

    const grade =
    document.getElementById("grade").value;

    const slides =
    document.getElementById("slides").value;

    const tone =
    document.getElementById("tone").value;

    const extra =
    document.getElementById("extra").value;

    const response =
    await fetch(
      "/.netlify/functions/presentation",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          topic,
          grade,
          slides,
          tone,
          extra,

          mode:"html"

        })
      }
    );

    const data =
    await response.json();

    console.log(data);

    if(!data?.deck){

      throw new Error(
        "Deck missing"
      );

    }

    if(
      !Array.isArray(data.deck.slides)
    ){

      throw new Error(
        "Slides missing"
      );

    }

    currentHtml =
    buildPresentation(data.deck);

    preview.srcdoc =
    currentHtml;

    statusEl.innerText =
    "Presentation generated successfully";

  }catch(err){

    console.error(err);

    statusEl.innerText =
    err.message;

  }

}

async function downloadPDF(){

  if(!currentHtml)
    return;

  statusEl.innerText =
  "Rendering PDF...";

  const temp =
  document.createElement("iframe");

  temp.style.position =
  "fixed";

  temp.style.left =
  "-99999px";

  document.body.appendChild(temp);

  temp.srcdoc =
  currentHtml;

  await new Promise(r =>
    setTimeout(r,2000)
  );

  const doc =
  temp.contentDocument;

  const slides =
  doc.querySelectorAll("section");

  const {
    jsPDF
  } = window.jspdf;

  const pdf =
  new jsPDF({
    orientation:"landscape",
    unit:"px",
    format:[1280,720]
  });

  for(let i=0;i<slides.length;i++){

    const canvas =
    await html2canvas(
      slides[i],
      {
        scale:2,
        backgroundColor:"#050816"
      }
    );

    const img =
    canvas.toDataURL(
      "image/jpeg",
      1
    );

    if(i > 0)
      pdf.addPage();

    pdf.addImage(
      img,
      "JPEG",
      0,
      0,
      1280,
      720
    );

  }

  pdf.save("presentation.pdf");

  temp.remove();

  statusEl.innerText =
  "PDF downloaded";

}

document
.getElementById("generateBtn")
.addEventListener(
  "click",
  generatePresentation
);

document
.getElementById("downloadBtn")
.addEventListener(
  "click",
  downloadPDF
);

</script>

</body>
</html>
