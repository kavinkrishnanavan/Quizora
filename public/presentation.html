<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Presentation Generator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0b1220;
      color: white;
    }

    .topbar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      width: 250px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }

    .loading {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <input id="topic" placeholder="Enter topic (e.g. Space, Life)">
    <button onclick="generate()">Generate</button>
  </div>

  <div class="loading" id="loading">Generating AI presentation...</div>

  <iframe id="frame"></iframe>

  <script>
    const frame = document.getElementById("frame");
    const loading = document.getElementById("loading");

    async function generate() {
      const topic = document.getElementById("topic").value.trim();
      if (!topic) return alert("Enter a topic");

      loading.style.display = "block";

      try {
        const res = await fetch("/.netlify/functions/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic })
        });

        const data = await res.json();

        if (!data.html) {
          throw new Error(data.error || "No HTML returned");
        }

        // DIRECT RENDER AI HTML
        frame.srcdoc = data.html;

      } catch (err) {
        frame.srcdoc = `
          <html>
            <body style="font-family: Arial; padding: 20px;">
              <h2>Generation Failed</h2>
              <p>${err.message}</p>
            </body>
          </html>
        `;
      }

      loading.style.display = "none";
    }
  </script>

</body>
</html>
