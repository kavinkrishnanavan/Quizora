<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz-Wiz Presentation</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    .controls {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 1000;
    }

    input, button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
    }

    input {
      width: 200px;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }

    .loading {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="controls">
    <input id="topic" placeholder="Enter topic (e.g. Life, Space)">
    <button onclick="generate()">Generate</button>
  </div>

  <div class="loading" id="loading">Generating presentation...</div>

  <iframe id="presentation"></iframe>

  <script>
    const iframe = document.getElementById("presentation");
    const loading = document.getElementById("loading");

    function buildSlides(deck) {
      return `
      <html>
      <head>
        <style>
          body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
          }

          .slide {
            display: none;
            padding: 60px;
            height: 100vh;
            box-sizing: border-box;
          }

          .slide.active {
            display: block;
          }

          h1 {
            font-size: 42px;
            margin-bottom: 20px;
          }

          p, li {
            font-size: 18px;
            line-height: 1.6;
          }

          ul {
            margin-top: 10px;
          }

          .nav {
            position: fixed;
            bottom: 20px;
            width: 100%;
            text-align: center;
          }

          button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
          }

          button:hover {
            background: #1d4ed8;
          }
        </style>
      </head>

      <body>

        ${deck.slides.map((s, i) => `
          <div class="slide ${i === 0 ? "active" : ""}">
            <h1>${s.heading}</h1>
            ${s.paragraphs.map(p => `<p>${p}</p>`).join("")}
            <ul>${s.bullets.map(b => `<li>${b}</li>`).join("")}</ul>
          </div>
        `).join("")}

        <div class="nav">
          <button onclick="prev()">Prev</button>
          <button onclick="next()">Next</button>
        </div>

        <script>
          let index = 0;
          const slides = document.querySelectorAll(".slide");

          function show(i) {
            slides.forEach(s => s.classList.remove("active"));
            slides[i].classList.add("active");
          }

          function next() {
            index = (index + 1) % slides.length;
            show(index);
          }

          function prev() {
            index = (index - 1 + slides.length) % slides.length;
            show(index);
          }
        <\/script>

      </body>
      </html>
      `;
    }

    async function generate() {
      const topic = document.getElementById("topic").value.trim();
      if (!topic) return alert("Enter a topic");

      loading.style.display = "block";

      try {
        const res = await fetch("/.netlify/functions/presentation", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            topic,
            slideCount: 8,
            audience: "Students",
            tone: "Simple and clear"
          })
        });

        const json = await res.json();

        if (!json.deck) {
          throw new Error(json.error || "No deck returned");
        }

        iframe.srcdoc = buildSlides(json.deck);

      } catch (err) {
        console.error(err);

        iframe.srcdoc = `
          <html>
            <body style="font-family: Arial; padding: 20px;">
              <h2>Failed to generate presentation</h2>
              <p>${err.message}</p>
            </body>
          </html>
        `;
      }

      loading.style.display = "none";
    }
  </script>

</body>
</html>
