    <style>
        .notes-layout { display: grid; gap: 18px; }
        .notes-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; } 
        .notes-actions .field { min-width: 240px; } 
        .notes-actions .field input { width: 100%; } 
        .notes-actions .field select { width: 100%; } 
        .notes-actions button { margin-top: 0; } 
        .status { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--status-bg); color: var(--status-text); display: none; } 
        .frame-wrap { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); background: rgba(127,127,127,0.05); } 
        iframe { width: 100%; height: 72vh; border: 0; background: white; } 
        .host-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; } 
        .host-row input { max-width: 520px; } 

        .portal-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .portal-meta { color: var(--muted); font-size: 0.9rem; }
        .sidebar-title { font-weight: 800; font-size: 1.05rem; }
        .sidebar-subtitle { color: var(--muted); font-size: 0.85rem; }
        .history-list { display: grid; gap: 10px; margin-top: 12px; max-height: 520px; overflow: auto; padding-right: 4px; }
        .history-entry { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: rgba(127,127,127,0.04); text-align: left; display: grid; gap: 6px; cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease; }
        .history-entry:hover { border-color: rgba(37, 99, 235, 0.45); background: rgba(37, 99, 235, 0.08); transform: translateY(-1px); }
        .history-entry.active { border-color: rgba(37, 99, 235, 0.8); background: rgba(37, 99, 235, 0.12); }
        .history-entry-title { font-weight: 700; font-size: 0.98rem; }
        .history-entry-meta { color: var(--muted); font-size: 0.82rem; }
        .history-entry-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .history-delete { background: transparent; color: inherit; border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
        .history-delete:hover { border-color: rgba(239, 68, 68, 0.55); color: #ef4444; }
    </style> 
</head>

    <script>
        const MATERIALS_STORAGE_KEY = "quizwiz_materials_v1";

        const frame = document.getElementById("frame");
        const statusEl = document.getElementById("status");
        const topicEl = document.getElementById("topic");
        const generateBtn = document.getElementById("generateBtn");
        const useMaterialsBtn = document.getElementById("useMaterialsBtn");
        const hostBtn = document.getElementById("hostBtn");
        const hostPanel = document.getElementById("hostPanel");
        const hostLinkEl = document.getElementById("hostLink"); 
        const copyHostLinkBtn = document.getElementById("copyHostLinkBtn"); 
        const openHostLinkBtn = document.getElementById("openHostLinkBtn"); 
        const historyList = document.getElementById("historyList");
        const historyStatus = document.getElementById("historyStatus");
        const historySubtitle = document.getElementById("historySubtitle");
        const refreshHistoryBtn = document.getElementById("refreshHistoryBtn"); 
 
        let lastHtml = ""; 
        let lastTopic = ""; 
        let presentationHistoryItems = []; 
        let activeHistoryId = "";
 
        function setStatus(text, kind) { 
            if (!statusEl) return; 
            statusEl.innerText = text || ""; 
            statusEl.style.display = text ? "block" : "none"; 
            if (kind === "error") {
                statusEl.style.background = "rgba(239, 68, 68, 0.12)";
                statusEl.style.color = "#ef4444";
                statusEl.style.borderColor = "rgba(239, 68, 68, 0.35)";
            } else {
                statusEl.style.background = "";
                statusEl.style.color = "";
                statusEl.style.borderColor = "";
            }
        }

        function getMaterialsStore() {
            const raw = localStorage.getItem(MATERIALS_STORAGE_KEY);
            if (!raw) return { learnedContext: "", presets: [] };
            try {
                const parsed = JSON.parse(raw);
                const presets = Array.isArray(parsed?.presets) ? parsed.presets : [];
                const learnedContext = typeof parsed?.learnedContext === "string" ? parsed.learnedContext : "";
                return { learnedContext, presets };
            } catch (_) {
                return { learnedContext: "", presets: [] };
            }
        }

        function setMaterialsStore(next) {
            localStorage.setItem(MATERIALS_STORAGE_KEY, JSON.stringify(next || { learnedContext: "", presets: [] }));
        }

        function htmlToText(html) {
            try {
                const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
                const text = String(doc?.body?.innerText || "").replace(/\n{3,}/g, "\n\n").trim();
                return text;
            } catch (_) {
                return ""; 
            } 
        } 
 
        function setHistoryStatus(text) {
            if (!historyStatus) return;
            historyStatus.innerText = text || "";
        }

        function applyActiveHighlight() {
            const entries = document.querySelectorAll(".history-entry");
            entries.forEach((entry) => {
                if (entry.dataset?.historyId === activeHistoryId) entry.classList.add("active");
                else entry.classList.remove("active");
            });
        }

        function renderPresentationHistory() {
            if (!historyList) return;
            historyList.innerHTML = "";

            const hasAuth = !!(window.QuizWizAuth && QuizWizAuth.getUser && QuizWizAuth.getUser());
            if (!hasAuth) {
                historyList.innerHTML = "<div class=\"portal-meta\">Please sign in to see history.</div>";
                if (historySubtitle) historySubtitle.innerText = "Sign in to load saved presentations.";
                return;
            }

            if (historySubtitle) historySubtitle.innerText = "Click a saved presentation to reload it.";

            if (!presentationHistoryItems.length) {
                historyList.innerHTML = "<div class=\"portal-meta\">No saved presentations yet.</div>";
                return;
            }

            presentationHistoryItems.forEach((item) => {
                const payload = item?.payload || {};
                const title = String(payload?.title || payload?.topic || "Presentation").trim() || "Presentation";
                const whenIso = String(item?.createdAt || payload?.createdAt || "").trim();
                const whenText = whenIso ? new Date(whenIso).toLocaleString() : "";

                const entry = document.createElement("div");
                entry.className = "history-entry";
                entry.dataset.historyId = item.id;

                const row = document.createElement("div");
                row.className = "history-entry-row";

                const titleEl = document.createElement("div");
                titleEl.className = "history-entry-title";
                titleEl.innerText = title;

                const delBtn = document.createElement("button");
                delBtn.type = "button";
                delBtn.className = "history-delete";
                delBtn.innerText = "Delete";
                delBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteHistoryEntry(item.id);
                });

                row.appendChild(titleEl);
                row.appendChild(delBtn);

                const meta = document.createElement("div");
                meta.className = "history-entry-meta";
                meta.innerText = whenText ? `Saved ${whenText}` : "Saved history";

                entry.appendChild(row);
                entry.appendChild(meta);

                entry.addEventListener("click", () => loadFromHistory(item.id));

                historyList.appendChild(entry);
            });

            applyActiveHighlight();
        }

        async function loadPresentationHistory() {
            if (!historyList) return;

            setHistoryStatus("Loading history...");
            presentationHistoryItems = [];

            const token = window.QuizWizAuth ? await QuizWizAuth.getAuthToken() : "";
            if (!token) {
                setHistoryStatus("");
                renderPresentationHistory();
                return;
            }

            try {
                const res = await fetch("/.netlify/functions/history?limit=50", {
                    headers: { Authorization: `Bearer ${token}` }
                });
                const data = await res.json().catch(() => null);
                if (!res.ok) throw new Error(data?.error || "Failed to load history.");

                const rawItems = Array.isArray(data?.items) ? data.items : [];
                const items = rawItems.map((item) => {
                    let payload = null;
                    try { payload = item.payloadJson ? JSON.parse(item.payloadJson) : null; } catch (_) { payload = null; }
                    return { ...item, payload };
                }).filter((x) => x?.payload?.type === "presentation" && x?.payload?.html);

                presentationHistoryItems = items;
                setHistoryStatus("");
                renderPresentationHistory();
            } catch (err) {
                console.warn("Failed to load presentation history", err);
                setHistoryStatus("Could not load history.");
                presentationHistoryItems = [];
                renderPresentationHistory();
            }
        }

        function loadFromHistory(historyId) {
            const id = String(historyId || "").trim();
            if (!id) return;
            const item = presentationHistoryItems.find((x) => String(x?.id || "") === id);
            const html = String(item?.payload?.html || "").trim();
            if (!html) return;

            const topic = String(item?.payload?.topic || item?.payload?.title || "").trim();
            if (topicEl && topic) topicEl.value = topic;
            lastTopic = topic || lastTopic;
            lastHtml = html;
            frame.srcdoc = html;
            useMaterialsBtn.disabled = false;
            hostBtn.disabled = false;
            hostPanel.style.display = "none";

            activeHistoryId = id;
            applyActiveHighlight();
            setStatus("Loaded from history.");
        }

        async function deleteHistoryEntry(historyId) {
            const safeId = String(historyId || "").trim();
            if (!safeId) return;

            const token = window.QuizWizAuth ? await QuizWizAuth.getAuthToken() : "";
            if (!token) return alert("Sign in to delete history.");

            const ok = confirm("Delete this history entry?");
            if (!ok) return;

            try {
                const res = await fetch(`/.netlify/functions/history?id=${encodeURIComponent(safeId)}`, {
                    method: "DELETE",
                    headers: { Authorization: `Bearer ${token}` },
                });
                const data = await res.json().catch(() => null);
                if (!res.ok) throw new Error(data?.error || "Failed to delete history.");

                if (activeHistoryId === safeId) activeHistoryId = "";
                await loadPresentationHistory();
                setStatus("Deleted history entry.");
            } catch (err) {
                alert(err?.message || "Failed to delete history.");
            }
        }
 
        async function savePresentationToHistory() { 
            const html = String(lastHtml || "").trim(); 
            const topic = String(lastTopic || "").trim(); 
            if (!html || !topic) return; 
 
            const token = window.QuizWizAuth ? await QuizWizAuth.getAuthToken() : ""; 
            if (!token) return; 
 
            try { 
                await fetch("/.netlify/functions/history", { 
                    method: "POST", 
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": `Bearer ${token}` 
                    }, 
                    body: JSON.stringify({ 
                        payload: { 
                            type: "presentation", 
                            title: topic, 
                            topic, 
                            html, 
                            createdAt: new Date().toISOString() 
                        } 
                    }) 
                }); 
            } catch (_) { 
                // ignore history failures 
            } 
        } 
 
        async function generate() { 
            const topic = String(topicEl?.value || "").trim(); 
            if (!topic) return alert("Enter a topic"); 
 
            hostPanel.style.display = "none";
            lastHtml = "";
            lastTopic = topic;
            useMaterialsBtn.disabled = true;
            hostBtn.disabled = true;

            generateBtn.disabled = true;
            setStatus("Generating notes...");
            try {
                const res = await fetch("/.netlify/functions/presentation", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ topic })
                });
                const data = await res.json().catch(() => null);
                if (!res.ok) throw new Error(data?.error || "Generation failed.");
                if (!data?.html) throw new Error("No HTML returned.");
 
                lastHtml = String(data.html); 
                frame.srcdoc = lastHtml; 
                useMaterialsBtn.disabled = false; 
                hostBtn.disabled = false; 
                setStatus("Notes ready. You can use them as learning material or host them for students."); 
                savePresentationToHistory().finally(loadPresentationHistory); 
            } catch (err) { 
                frame.srcdoc = ` 
                    <html><body style="font-family: Arial; padding: 20px;"> 
                        <h2>Generation Failed</h2> 
                        <p>${String(err?.message || "Unknown error")}</p>
                    </body></html>
                `;
                setStatus(String(err?.message || "Generation failed."), "error");
            } finally {
                generateBtn.disabled = false;
            }
        }

        async function useAsLearningMaterial() {
            if (!lastHtml) return;
            const text = htmlToText(lastHtml);
            if (!text) return alert("Could not extract text from the generated notes.");

            const store = getMaterialsStore();
            setMaterialsStore({ ...store, learnedContext: text });
            setStatus("Saved as learning material. Open Personalized/Baseline to generate tests using it.");
        }

        async function hostNotes() {
            if (!lastHtml) return;

            const token = window.QuizWizAuth ? await QuizWizAuth.getAuthToken() : "";
            if (!token) {
                setStatus("Sign in to host notes for students.", "error");
                if (window.QuizWizAuth) QuizWizAuth.openAccountModal();
                return;
            }

            hostBtn.disabled = true;
            setStatus("Hosting notes...");
            try {
                const res = await fetch("/.netlify/functions/notes-host", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        html: lastHtml,
                        meta: { topic: lastTopic || "" }
                    })
                });

                const data = await res.json().catch(() => null);
                if (!res.ok) throw new Error(data?.error || "Failed to host notes.");
                const notesId = String(data?.notesId || "").trim();
                const accessCode = String(data?.accessCode || "").trim();
                if (!notesId || !accessCode) throw new Error("Invalid host response.");

                const url = `${location.origin}/notes.html?notesId=${encodeURIComponent(notesId)}&code=${encodeURIComponent(accessCode)}`;
                hostLinkEl.value = url;
                openHostLinkBtn.href = url;
                hostPanel.style.display = "block";
                setStatus("Hosted! Share the link with students.");
            } catch (err) {
                setStatus(String(err?.message || "Failed to host notes."), "error");
            } finally {
                hostBtn.disabled = false;
            }
        }

        async function copyHostLink() {
            const value = String(hostLinkEl?.value || "").trim();
            if (!value) return;
            try {
                await navigator.clipboard.writeText(value);
                setStatus("Copied hosted link.");
            } catch (_) {
                hostLinkEl.select();
                document.execCommand("copy");
                setStatus("Copied hosted link.");
            }
        }

        generateBtn?.addEventListener("click", generate); 
        topicEl?.addEventListener("keydown", (e) => { 
            if (e.key === "Enter") generate(); 
        }); 
        useMaterialsBtn?.addEventListener("click", useAsLearningMaterial); 
        hostBtn?.addEventListener("click", hostNotes); 
        copyHostLinkBtn?.addEventListener("click", copyHostLink); 
        refreshHistoryBtn?.addEventListener("click", loadPresentationHistory); 
        if (window.QuizWizAuth) QuizWizAuth.onChange(loadPresentationHistory); 
        loadPresentationHistory(); 

        (function () {
            const loginLink = document.getElementById("loginLink");
            const profileLink = document.getElementById("profileLink");
            if (!window.QuizWizAuth || !loginLink || !profileLink) return;
            QuizWizAuth.onChange((user) => {
                const isIn = !!user;
                loginLink.style.display = isIn ? "none" : "inline-flex";
                profileLink.style.display = isIn ? "inline-flex" : "none";
            });
        })();
    </script>
